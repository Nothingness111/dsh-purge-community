name: Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/compat-dsh-0.2.2.mjs
          node --check scripts/check-compat.mjs
          node --input-type=module -e "import('./lib/index.js')"
      - name: Unit tests
        continue-on-error: true
        run: node --test

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          prefix="dsh-purge-community-${version}"
          git archive --format=zip --prefix="${prefix}/" --output="${prefix}.zip" HEAD
          test -s "${prefix}.zip"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          zip="dsh-purge-community-${version}.zip"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" --title "$tag" --notes-file CHANGELOG.md "$zip"
          fi
